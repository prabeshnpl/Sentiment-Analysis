<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #eef2f7;
            color: #1f2937;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top left, #dfe8ff 0%, transparent 38%),
                        radial-gradient(circle at bottom right, #ffe7ec 0%, transparent 36%),
                        #eef2f7;
        }
        .page-card {
            width: min(100%, 560px);
            padding: 28px;
            border-radius: 26px;
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }
        .subtitle {
            margin: 0 0 24px;
            color: #64748b;
            line-height: 1.7;
        }
        form {
            display: grid;
            gap: 16px;
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        input[type="text"] {
            flex: 1 1 100%;
            min-width: 0;
            padding: 14px 16px;
            border: 1px solid #d2d8e0;
            border-radius: 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: #4f7bff;
            box-shadow: 0 0 0 5px rgba(79, 123, 255, 0.12);
        }
        button {
            padding: 14px 22px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #5d72ff, #35c4ff);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }
        .result-panel {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }
        .result-card {
            display: grid;
            gap: 14px;
            padding: 18px;
            border-radius: 18px;
            background: #f8fbff;
            border: 1px solid #e6ecf6;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 14px 16px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #e7effa;
        }
        .result-row span {
            color: #475569;
        }
        .result-row strong {
            color: #111827;
            font-size: 0.98rem;
        }
    </style>
</head>
<body>
    <div class="page-card">
        <h1>Sentiment Analysis</h1>
        <p class="subtitle">Enter a short review or text and see predictions from Naive Bayes and SVM.</p>

        <form method="POST">
            <div class="input-wrapper">
                <input type="text" name="input_text" placeholder="Type your sentence here..." value="{{ input_text|default('') }}">
                <button type="submit">Analyze</button>
            </div>
        </form>

        {% if nb_prediction or svm_prediction %}
            <div class="result-panel">
                <div class="result-card">
                    <div class="result-row">
                        <span>Your text</span>
                        <strong>{{ input_text }}</strong>
                    </div>                    
                    <div class="result-row">
                        <span>Support Vector Machine (SVM)</span>
                        <strong>{{ svm_prediction }}</strong>
                    </div>
                    <div class="result-row">
                        <span>Naive Bayes</span>
                        <strong>{{ nb_prediction }}</strong>
                    </div>
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
